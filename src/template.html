<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo.Flow</title>
  </head>
  <body>
    <div id="sidebar">
      <h1>Todo.Flow</h1>
      <button id="add-task">Add Task</button>
      <div id="task-filter">
        <button id="inbox">Inbox</button>
        <button id="today">Today</button>
        <button id="upcoming">Upcoming</button>
        <button id="completed">Completed</button>
      </div>
      <div id="projects">
        <h2>Projects</h2>
        <div id="project-list">
          <button id="project1">Project 1</button>
          <button id="project2">Project 2</button>
          <button id="project3">Project 3</button>
        </div>
      </div>
    </div>
    <div id="main">
      <h1>Header</h1>
      <div id="task-list">
        <div id="task-example">
          <button id="complete-task">Complete</button>
          <div id="task-wrapper">
            <h3>Task 1</h3>
            <div id="task-info">
              <p>Due Date</p>
              <p>Priority</p>
              <p>Project</p>
            </div>
            <button id="info">Info</button>
            <button id="edit-task">Edit</button>
            <button id="delete-task">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
